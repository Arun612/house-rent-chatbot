services:
  - type: web
    name: house-rent-chatbot
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: house-rent-chatbot
      - key: GROQ_LLM_MODEL
        value: llama-3.1-8b-instant
      - key: PYTHON_VERSION
        value: 3.11.0
